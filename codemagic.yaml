workflows:
  android-workflow:
    name: Android AAB & APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      android_signing:
        - keystore_reference
      groups:
        - app_credentials
      vars:
        PACKAGE_NAME: "com.anonymous.reactnativerepo"
      node: 20.11.0
      java: 17
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Run automated unit tests
        script: |
          npx vitest run
      - name: Expo prebuild Android
        script: |
          npx expo prebuild --platform android --clean
      - name: Build Android Release AAB & APK
        script: |
          cd android
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - dev-team@example.com
        notify:
          success: true
          failure: true

  ios-workflow:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.anonymous.reactnativerepo
      groups:
        - app_credentials
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/reactnativerepo.xcworkspace"
        XCODE_SCHEME: "reactnativerepo"
      node: 20.11.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Run automated unit tests
        script: |
          npx vitest run
      - name: Expo prebuild iOS
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
