# ──────────────────────────────────────────────────────────
# Student-facing Expo Web App (Root)
# Netlify builds the Expo web export from the repo root.
# The admin dashboard has its OWN Netlify site configured
# with Base directory = "admin" in the Netlify UI.
# ──────────────────────────────────────────────────────────

[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https://*.convex.cloud https://*.convex.site; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://*.convex.cloud https://*.convex.cloud https://*.convex.site;"
